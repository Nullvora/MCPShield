[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpshield"
dynamic = ["version"]
description = "Security scanner, hardening checker and runtime guard for Model Context Protocol (MCP) servers and AI-agent configurations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "James Kwasi Boamah", email = "security@nullvora.com" }, { name = "Nullvora Inc." }]
maintainers = [{ name = "Nullvora", email = "security@nullvora.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "security", "ai-security", "llm", "agents", "prompt-injection", "tool-poisoning", "sarif", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=15.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0.1",
    "packaging>=23.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "mcp>=1.23.0,<3",
    "build>=1.2",
]

[project.scripts]
mcpshield = "mcpshield.cli:main"

[project.urls]
Homepage = "https://nullvora.com"
Repository = "https://github.com/Nullvora/MCPShield"
Issues = "https://github.com/Nullvora/MCPShield/issues"
Documentation = "https://github.com/Nullvora/MCPShield/tree/main/docs"
Changelog = "https://github.com/Nullvora/MCPShield/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "mcpshield.__version__" }

[tool.setuptools.packages.find]
include = ["mcpshield*"]

[tool.setuptools.package-data]
"mcpshield" = ["py.typed"]
"mcpshield.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: starts local MCP server processes (requires the 'mcp' package)"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "BLE"]
ignore = ["S101", "S104", "S110", "S112", "S603", "S607", "S311", "E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "BLE"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.coverage.run]
source = ["mcpshield"]
omit = ["mcpshield/__main__.py"]
