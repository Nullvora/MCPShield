# MCPShield Alert Rules — Privilege Escalation Detection
# Load these with: mcpshield monitor --policy privilege_escalation.yaml

rules:
  - id: PE-001
    description: Block shell/exec tools with pipe or redirection characters
    action: block
    tools: ["bash", "shell", "execute", "run", "eval"]
    param_patterns:
      - "[|;&amp;`\\$\\(\\)]"

  - id: PE-002
    description: Alert on filesystem access to sensitive paths
    action: alert
    tools: ["read_file", "write_file", "list_directory", "filesystem"]
    param_patterns:
      - "(/etc/passwd|/etc/shadow|\\.ssh/|\\.aws/credentials|\\.env)"
      - "(id_rsa|id_ed25519|\\.pem|\\.key|\\.p12)"

  - id: PE-003
    description: Alert on database write operations
    action: alert
    tools: ["postgres", "mysql", "sqlite", "database", "mongodb"]
    param_patterns:
      - "(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE TABLE)"
