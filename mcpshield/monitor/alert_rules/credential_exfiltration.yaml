# MCPShield Alert Rules — Credential Exfiltration Detection
# Load these with: mcpshield monitor --policy credential_exfiltration.yaml

rules:
  - id: CE-001
    description: Block tool calls with credential-shaped values in parameters
    action: block
    param_patterns:
      - "sk-[a-zA-Z0-9]{32,}"
      - "gh[pousr]_[A-Za-z0-9]{36,}"
      - "AKIA[0-9A-Z]{16}"

  - id: CE-002
    description: Alert on email/send tools accessing credential-named env vars
    action: alert
    tools: ["send_email", "gmail", "outlook", "send_message", "post"]

  - id: CE-003
    description: Block any tool that chains from env/config to send
    action: alert
    param_patterns:
      - "(credential|secret|token|password|api_key)"
    tools: ["send_email", "gmail", "outlook", "http_post"]
