name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  pypi:
    needs: validate
    # Explicitly enable only after configuring the protected environment and trusted publisher.
    if: vars.MCPSHIELD_ENABLE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from mcpshield import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__, "tag/version mismatch"'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
